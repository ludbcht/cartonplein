<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carton Plein — Cartes à collectionner Ligue 1 2026-2027</title>
<style>
:root{
  --pitch:#0d3527; --pitch2:#0f3d2d; --deep:#082319; --chalk:#eef3ee; --muted:#9fbcad;
  --line:rgba(238,243,238,.16); --gold:#e8b923; --danger:#e5484d;
  --rC:#9aa5a0; --rPC:#3fbf6f; --rR:#3a86f0; --rE:#a159ea; --rL:#e8b923;
  --cond:"Bahnschrift","DIN Condensed","DIN Alternate","Roboto Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100vh}
body{
  font-family:var(--body);color:var(--chalk);
  background:repeating-linear-gradient(90deg,var(--pitch) 0 72px,var(--pitch2) 72px 144px) fixed;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(64px + env(safe-area-inset-bottom,0px));
  -webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* ---------- En-tête ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:12px;
  padding:10px 16px;background:rgba(8,35,25,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:9px;margin-right:auto;color:var(--chalk);text-decoration:none}
.logo svg{width:34px;height:34px;flex:none;filter:drop-shadow(0 3px 6px rgba(0,0,0,.35))}
.logo .wm{display:flex;flex-direction:column;line-height:.86;font-family:var(--cond);font-style:italic;font-weight:900;letter-spacing:-.6px}
.logo .wm b{font-size:24px;font-weight:900}
.logo .wm span{font-size:10.5px;font-weight:700;font-style:normal;letter-spacing:.2px;color:var(--muted);margin-top:3px}
.logo.xl svg{width:72px;height:72px}.logo.xl .wm b{font-size:44px}.logo.xl .wm span{font-size:15px;margin-top:6px}
.wallet{display:flex;gap:8px}
.chip{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.07);border:1px solid var(--line);
  border-radius:999px;padding:5px 11px 5px 7px;font-family:var(--cond);font-weight:700;font-size:16px;white-space:nowrap}
.coin{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3b0,#e8b923 45%,#a87a06);
  box-shadow:inset 0 0 0 2px rgba(0,0,0,.15)}
.mini-pack{width:14px;height:19px;border-radius:2px;background:linear-gradient(135deg,#c9d6cf,#fff 40%,#9fb3a8);box-shadow:0 0 0 1px rgba(0,0,0,.2)}

/* ---------- Navigation ---------- */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);
  background:rgba(8,35,25,.96);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs button{background:none;border:0;padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:11.5px;color:var(--muted)}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--chalk)}
nav.tabs button[aria-current="page"] svg{color:var(--gold)}
@media (min-width:900px){
  body{padding-bottom:0}
  nav.tabs{position:sticky;top:calc(env(safe-area-inset-top,0px) + 53px);bottom:auto;display:flex;justify-content:center;gap:4px;
    border-top:0;border-bottom:1px solid var(--line);padding:0 16px}
  nav.tabs button{flex-direction:row;font-size:14px;padding:10px 16px;gap:8px;border-bottom:3px solid transparent}
  nav.tabs button[aria-current="page"]{border-bottom-color:var(--gold)}
  nav.tabs button svg{width:18px;height:18px}
}
main{max-width:1180px;margin:0 auto;padding:18px 16px 32px}
h1,h2,h3{font-family:var(--cond);font-weight:800;margin:0;line-height:1.05}
h2{font-size:26px;letter-spacing:-.3px}
h3{font-size:19px}
p{line-height:1.5}
.muted{color:var(--muted)}
.section{margin-top:28px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.btn{border:0;border-radius:10px;padding:12px 18px;font-family:var(--cond);font-weight:800;font-size:17px;
  background:var(--chalk);color:var(--deep);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.gold{background:var(--gold);color:#2a1f00}
.btn.ghost{background:transparent;color:var(--chalk);border:1.5px solid var(--line)}
.btn.small{padding:8px 12px;font-size:15px;border-radius:8px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.danger{background:var(--danger);color:#fff}

/* ---------- Accueil / booster ---------- */
.hero{display:grid;grid-template-columns:1fr;gap:22px;align-items:center}
@media (min-width:760px){.hero{grid-template-columns:300px 1fr}}
.pack-big{container-type:inline-size;justify-self:center;width:210px;aspect-ratio:5/7.8;border:0;padding:0;background:none;position:relative;perspective:900px}
.pk{--a:#1d8a60;--b:#05241a;--acc:#e8b923;--ink:#fff;position:absolute;inset:0;transform-style:preserve-3d;
  transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .25s ease-out;
  filter:drop-shadow(0 5cqw 7cqw rgba(0,0,0,.55)) drop-shadow(0 0 10cqw color-mix(in srgb,var(--acc) 25%,transparent))}
.pk.prestige{--a:#2b2b2e;--b:#060606;--acc:#f3c94a}
.pk-top,.pk-main{position:absolute;left:0;right:0;overflow:hidden;
  background:radial-gradient(120% 75% at 28% 18%,var(--a),var(--b) 72%)}
.pk.prestige .pk-top,.pk.prestige .pk-main{background:
  repeating-linear-gradient(135deg,rgba(243,201,74,.07) 0 .4cqw,transparent .4cqw 6cqw),
  radial-gradient(120% 75% at 28% 18%,var(--a),var(--b) 72%)}
.pk-top{top:0;height:13%;background-size:100% 769%!important;background-position:top!important;
  -webkit-mask:conic-gradient(from 135deg at top,#0000,#000 1deg 89deg,#0000 90deg) top/4.6cqw 51% repeat-x,linear-gradient(#000 0 0) bottom/100% 50% no-repeat;
          mask:conic-gradient(from 135deg at top,#0000,#000 1deg 89deg,#0000 90deg) top/4.6cqw 51% repeat-x,linear-gradient(#000 0 0) bottom/100% 50% no-repeat}
.pk-main{top:13%;bottom:0;background-size:100% 115%!important;background-position:bottom!important;
  -webkit-mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) bottom/4.6cqw 51% repeat-x,linear-gradient(#000 0 0) top/100% 50% no-repeat;
          mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) bottom/4.6cqw 51% repeat-x,linear-gradient(#000 0 0) top/100% 50% no-repeat}
/* sertissage */
.pk-top::before,.pk-main::after{content:"";position:absolute;left:0;right:0;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.2) 0 1.1cqw,rgba(0,0,0,.25) 1.1cqw 2.2cqw);opacity:.75}
.pk-top::before{top:0;height:70%}
.pk-main::after{bottom:0;height:7.5%}
/* perforation */
.pk-main::before{content:"";position:absolute;left:3cqw;right:3cqw;top:0;border-top:.55cqw dashed rgba(255,255,255,.45);z-index:3}
/* matière : relief, plis, reflet métallisé */
.pk-mat{position:absolute;inset:0;pointer-events:none;
  background:
    linear-gradient(90deg,rgba(0,0,0,.45),transparent 13%,transparent 87%,rgba(0,0,0,.45)),
    repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 .5cqw,transparent .5cqw 11cqw),
    conic-gradient(from 210deg at 75% 25%,rgba(255,0,170,.05),rgba(0,255,220,.06),rgba(255,230,0,.05),rgba(120,120,255,.05),rgba(255,0,170,.05));
  mix-blend-mode:screen}
.pk-sheen{position:absolute;inset:0;pointer-events:none;z-index:4;
  background:linear-gradient(112deg,transparent 30%,rgba(255,255,255,.38) 46%,rgba(255,255,255,.08) 52%,transparent 64%) var(--sx,75%) 0/280% 100% no-repeat;
  mix-blend-mode:overlay;transition:background-position .25s ease-out}
.pack-big:not(:disabled):hover .pk-sheen{animation:pkSheen 1.3s ease}
@keyframes pkSheen{from{background-position:120% 0}to{background-position:-20% 0}}
/* contenu */
.pk-body::before{content:"";position:absolute;inset:-1% -4% 3%;border:.45cqw solid var(--acc);opacity:.45;border-radius:3cqw;pointer-events:none}
.pk.prestige .pk-body::before{opacity:.8;box-shadow:inset 0 0 0 1.2cqw rgba(0,0,0,.25),inset 0 0 0 1.6cqw rgba(243,201,74,.35)}
.pk-body{position:absolute;inset:6% 9% 11%;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4cqw;
  font-family:var(--cond);color:var(--ink);text-align:center}
.pk-body .pk-mark svg{width:42cqw;height:42cqw;display:block;filter:drop-shadow(0 3cqw 4cqw rgba(0,0,0,.45))}
.pk-body .pk-mark .crest{width:36cqw;height:41cqw}
.pk-wm{font-size:19cqw;font-weight:900;font-style:italic;letter-spacing:-.6cqw;line-height:.9;text-shadow:0 1cqw 4cqw rgba(0,0,0,.5)}
.pk-sub{font-size:5.6cqw;font-weight:800;letter-spacing:.3cqw;color:var(--acc);display:flex;align-items:center;gap:2.4cqw}
.pk-sub::before,.pk-sub::after{content:"";width:7cqw;height:.45cqw;background:currentColor;opacity:.7}
.pk-foot{position:absolute;left:0;right:0;bottom:-1cqw;display:flex;justify-content:center;gap:2cqw;align-items:center}
.pk-foot b{font-size:5.4cqw;font-weight:800;background:rgba(0,0,0,.35);border:.35cqw solid rgba(255,255,255,.28);padding:1.3cqw 3.2cqw;border-radius:99px;
  -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.pk-gems{display:flex;gap:1.6cqw}
.pk-gems i{width:3.2cqw;height:3.2cqw;transform:rotate(45deg);border-radius:.6cqw;box-shadow:0 0 0 .35cqw rgba(0,0,0,.35)}
.pack-big:disabled .pk{filter:grayscale(.9) brightness(.5) drop-shadow(0 5cqw 7cqw rgba(0,0,0,.4))}
.pack-big.mini{width:66px;flex:none;pointer-events:none}
.pack-big.mini .pk{filter:drop-shadow(0 4cqw 5cqw rgba(0,0,0,.5))}
.pack-count{position:absolute;right:-12px;top:-4px;z-index:4;background:var(--gold);color:#2a1f00;font-family:var(--cond);
  font-weight:900;font-size:20px;min-width:40px;height:40px;border-radius:999px;display:grid;place-items:center;border:3px solid var(--deep)}
@keyframes sheen{from{background-position:100% 0,0 0}to{background-position:-50% 0,0 0}}
.timer{font-family:var(--cond);font-size:44px;font-weight:800;letter-spacing:-.5px;line-height:1}
.statline{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:16px}
.stat{border-left:3px solid var(--gold);padding:4px 0 4px 12px}
.stat b{display:block;font-family:var(--cond);font-size:28px;font-weight:800}
.stat span{font-size:13px;color:var(--muted)}

.shop{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;margin-top:14px}
.offer{border:1px solid var(--line);border-radius:12px;padding:16px;background:rgba(0,0,0,.18);display:flex;flex-direction:column;gap:10px}
.offer h3{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px}
.offer-head{display:flex;gap:16px;align-items:center}
.offer-head > div:last-child{flex:1;min-width:0}
.price{display:inline-flex;align-items:center;gap:5px;font-family:var(--cond);font-weight:800;font-size:18px}
select{font:inherit;color:var(--chalk);background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:8px;padding:9px 10px}
select option{color:#111}

.bars{display:grid;gap:9px;margin-top:12px}
.bar{display:grid;grid-template-columns:110px 1fr 70px;gap:10px;align-items:center;font-size:14px}
.bar .track{height:10px;border-radius:5px;background:rgba(255,255,255,.08);overflow:hidden}
.bar .fill{height:100%;border-radius:5px}
.bar .n{text-align:right;font-family:var(--cond);font-weight:700}

/* ---------- Cartes ---------- */
.grid>button,.lineup>button,.bigcard,.round>div,.mkt .item>button,.face,.cw{container-type:inline-size}
.card{--c1:#333;--c2:#999;--rc:#c9d1cd;--rc2:#6f7a75;container-type:inline-size;position:relative;width:100%;aspect-ratio:5/7;
  border-radius:6.5%/4.6%;padding:1.8%;isolation:isolate;user-select:none;
  background:linear-gradient(150deg,var(--rc) 0%,var(--rc2) 45%,var(--rc) 70%,var(--rc2) 100%);
  box-shadow:inset 0 .6cqw 0 rgba(255,255,255,.45),0 2cqw 5cqw -1cqw rgba(0,0,0,.55),0 .5cqw 1cqw rgba(0,0,0,.3)}
.card.r-C{--rc:#d3dad6;--rc2:#7c8781}
.card.r-PC{--rc:#8af0b2;--rc2:#178a48}
.card.r-R{--rc:#9fcbff;--rc2:#1b56c0}
.card.r-E{--rc:#ead2ff;--rc2:#6d22c7}
.card.r-L{--rc:#fff4bd;--rc2:#a87a06}
.card.r-E::before,.card.r-L::before{content:"";position:absolute;inset:0;border-radius:inherit;z-index:0;pointer-events:none;
  background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.95) 48%,transparent 66%);background-size:260% 100%;
  mix-blend-mode:overlay;animation:foil 3.2s linear infinite}
@keyframes foil{from{background-position:130% 0}to{background-position:-130% 0}}
.card-in{position:relative;z-index:1;width:100%;height:100%;border-radius:5%/3.6%;overflow:hidden;
  background:
    radial-gradient(circle at 50% 50%,rgba(255,255,255,.13) .45cqw,transparent .6cqw) 0 0/3.4cqw 3.4cqw,
    linear-gradient(162deg,var(--c1) 0 48%,var(--c2) 48% 53%,var(--c1) 53%);
  box-shadow:inset 0 0 0 .5cqw rgba(0,0,0,.35)}
.photo{position:absolute;inset:0}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 14%;opacity:0;transition:opacity .35s}
.photo img.ok{opacity:1}
.mono{position:absolute;inset:0}
.mono svg{position:absolute;left:0;right:0;top:4%;width:100%;height:auto}
.photo img.ok + .mono{display:none}
.shade{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(0,0,0,.5) 0%,transparent 24%,transparent 46%,rgba(0,0,0,.55) 66%,rgba(0,0,0,.9) 100%)}
.shade::after{content:"";position:absolute;inset:auto 0 0 0;height:45%;background:linear-gradient(0deg,var(--c1),transparent);opacity:.55;mix-blend-mode:multiply}
.rate{position:absolute;left:5cqw;top:4cqw;z-index:2;display:flex;flex-direction:column;align-items:center;font-family:var(--cond);color:#fff;line-height:.82;
  text-shadow:0 .6cqw 1.5cqw rgba(0,0,0,.5)}
.rate b{font-size:19cqw;font-weight:900;letter-spacing:-.8cqw}
.rate span{margin-top:1.6cqw;font-size:6.2cqw;font-weight:800;letter-spacing:.4cqw;padding-top:1.4cqw;border-top:.5cqw solid var(--rc)}
.ctag{position:absolute;right:4.5cqw;top:5cqw;z-index:2;display:flex;flex-direction:column;align-items:flex-end;gap:2.6cqw}
.cclub{font-family:var(--cond);font-weight:800;font-size:6.4cqw;color:#fff;line-height:1;padding:1.4cqw 2.8cqw;border-radius:99px;
  background:rgba(10,14,12,.45);border:.4cqw solid rgba(255,255,255,.28);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.gem{width:6.4cqw;height:6.4cqw;transform:rotate(45deg);border-radius:1.2cqw;margin-right:1.2cqw;
  background:linear-gradient(135deg,#fff,var(--rc) 40%,var(--rc2));box-shadow:0 0 0 .5cqw rgba(0,0,0,.35),0 0 3cqw var(--rc)}
.cbody{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:0 5.5cqw 5cqw;color:#fff;font-family:var(--cond)}
.cname{line-height:.95;text-shadow:0 .5cqw 1.5cqw rgba(0,0,0,.6)}
.cname small{display:block;font-size:7cqw;font-weight:600;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cname b{display:block;font-size:13cqw;font-weight:900;text-transform:uppercase;letter-spacing:-.3cqw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rline{height:.6cqw;margin:3cqw 0 2.8cqw;border-radius:1cqw;background:linear-gradient(90deg,var(--rc),var(--rc2) 60%,transparent)}
.cstats{display:grid;grid-template-columns:1fr 1fr;gap:4.5cqw}
.st > div{display:flex;justify-content:space-between;align-items:baseline;line-height:1}
.st span{font-size:5.6cqw;font-weight:700;opacity:.75;letter-spacing:.2cqw}
.st b{font-size:8.4cqw;font-weight:900}
.st i{display:block;height:1.2cqw;margin-top:1.4cqw;border-radius:1cqw;background:rgba(255,255,255,.18);overflow:hidden}
.st i::after{content:"";display:block;height:100%;width:var(--v);border-radius:inherit;background:#fff}
.st.def i::after{background:var(--rc)}
.cbadge{position:absolute;z-index:6;top:-2.5cqw;right:-2.5cqw;font-family:var(--cond);font-weight:900;font-size:7cqw;line-height:1;
  background:var(--chalk);color:var(--deep);padding:1.6cqw 3.2cqw;border-radius:99px;box-shadow:0 1cqw 3cqw rgba(0,0,0,.4)}
.cbadge.new{background:var(--gold);color:#2a1f00}
.crest{display:block;flex:none;filter:drop-shadow(0 .4cqw 1cqw rgba(0,0,0,.45))}
.ccrest{width:17cqw;height:19.5cqw;margin-bottom:-.6cqw}
.chipcrest{width:20px;height:23px}
.bannercrest{width:46px;height:53px}
.oppcrest{width:34px;height:39px;margin-bottom:4px}
.fichecrest{width:40px;height:46px}
/* Brillante */
.card.shiny .card-in::after{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;mix-blend-mode:color-dodge;opacity:.5;
  background:linear-gradient(115deg,transparent 20%,rgba(255,0,140,.55) 35%,rgba(255,230,0,.55) 45%,rgba(0,255,200,.55) 55%,rgba(80,120,255,.55) 65%,transparent 80%);
  background-size:250% 250%;background-position:var(--hx,30%) var(--hy,30%);animation:holo 4s linear infinite}
@keyframes holo{0%{background-position:0% 0%}100%{background-position:200% 200%}}
.shiny-tag{position:absolute;z-index:6;left:50%;bottom:-2.6cqw;transform:translateX(-50%);font-family:var(--cond);font-weight:900;font-size:6.2cqw;line-height:1;
  background:linear-gradient(90deg,#ff5fb2,#ffe14d,#4dffd2,#7d8cff);color:#1a1a1a;padding:1.2cqw 3.4cqw;border-radius:99px;white-space:nowrap}

/* Emplacement vide */
.slot{position:relative;width:100%;aspect-ratio:5/7;border-radius:6.5%/4.6%;border:1.5px dashed rgba(238,243,238,.22);
  background:linear-gradient(160deg,rgba(255,255,255,.05),rgba(0,0,0,.25));display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:6%;gap:3cqw;color:var(--muted)}
.slot .sil{width:42cqw;height:42cqw;opacity:.35}
.slot .snum{font-family:var(--cond);font-weight:800;font-size:12cqw;color:rgba(238,243,238,.45)}
.slot .sname{font-family:var(--cond);font-weight:700;font-size:8.5cqw;line-height:1.05;color:rgba(238,243,238,.7)}
.slot .srar{display:flex;align-items:center;gap:2cqw;font-size:7cqw}
.slot .srar i{width:5cqw;height:5cqw;transform:rotate(45deg);border-radius:.8cqw}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:12px}
@media (min-width:600px){.grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}}
.grid > button{border:0;padding:0;background:none;text-align:left}

/* ---------- Album ---------- */
.albumhead{display:flex;flex-wrap:wrap;gap:14px;align-items:end;justify-content:space-between}
.bigpct{font-family:var(--cond);font-weight:900;font-size:54px;line-height:.9;letter-spacing:-1px}
.clubs{display:flex;gap:8px;overflow-x:auto;padding:14px 2px 10px;scrollbar-width:thin}
.clubchip{flex:none;border:1.5px solid var(--line);background:rgba(0,0,0,.2);border-radius:10px;padding:7px 10px 7px 8px;display:flex;align-items:center;gap:8px;
  font-family:var(--cond);font-weight:700;font-size:15px}
.clubchip .sw{width:16px;height:22px;border-radius:3px;background:linear-gradient(155deg,var(--c1) 55%,var(--c2) 55%);box-shadow:0 0 0 1px rgba(255,255,255,.25)}
.clubchip small{color:var(--muted);font-weight:600}
.clubchip[aria-pressed="true"]{border-color:var(--gold);background:rgba(232,185,35,.12)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.clubbanner{display:flex;align-items:center;gap:14px;margin:6px 0 16px;padding:14px 16px;border-radius:12px;
  background:linear-gradient(110deg,var(--c1) 60%,var(--c2) 60% 64%,var(--c1) 64%);border:1px solid rgba(255,255,255,.2)}
.clubbanner h3{font-size:24px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.3)}
.clubbanner .p{margin-left:auto;font-family:var(--cond);font-weight:900;font-size:28px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.3)}
.posgroup{margin:22px 0 10px;font-family:var(--cond);font-weight:800;font-size:18px;color:var(--muted);display:flex;align-items:center;gap:10px}
.posgroup::after{content:"";flex:1;border-top:1px solid var(--line)}

/* ---------- Overlay & modale ---------- */
.ov{position:fixed;inset:0;z-index:100;background:rgba(4,18,12,.9);backdrop-filter:blur(6px);display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:calc(20px + env(safe-area-inset-top,0px)) 16px calc(20px + env(safe-area-inset-bottom,0px));overflow-y:auto}
.ov[hidden]{display:none}
.close-x{position:fixed;z-index:110;top:calc(12px + env(safe-area-inset-top,0px));right:14px;background:rgba(255,255,255,.1);border:0;width:40px;height:40px;border-radius:50%;font-size:22px;line-height:1}
.stage{width:100%;max-width:1000px;display:flex;flex-direction:column;align-items:center;gap:22px}
.stage .pack-big{width:220px}
.stage .pack-big{width:min(240px,62vw);animation:pkFloat 3.2s ease-in-out infinite}
@keyframes pkFloat{50%{translate:0 -6px}}
.stage .pack-big::before{content:"";position:absolute;inset:-25%;z-index:-1;border-radius:50%;
  background:radial-gradient(closest-side,color-mix(in srgb,var(--glow,#e8b923) 45%,transparent),transparent);animation:pkGlow 2.4s ease-in-out infinite}
@keyframes pkGlow{50%{opacity:.55;transform:scale(.92)}}
.stage .pack-big.torn{animation:none}
.stage .pack-big.torn .pk-top{animation:tear .6s cubic-bezier(.3,.6,.4,1) forwards;transform-origin:10% 100%}
.stage .pack-big.torn .pk-main{animation:packout .6s .38s ease-in forwards}
.stage .pack-big.torn::after{content:"";position:absolute;left:-10%;right:-10%;top:8%;height:10%;border-radius:50%;z-index:5;
  background:radial-gradient(closest-side,#fff,rgba(255,255,255,0));animation:flash .5s .05s ease-out both}
@keyframes tear{to{transform:translate(22cqw,-38cqw) rotate(22deg);opacity:0}}
@keyframes packout{to{transform:translateY(30cqw) scale(.75);opacity:0}}
@keyframes flash{from{opacity:0;transform:scaleX(.3)}40%{opacity:1}to{opacity:0;transform:scaleX(1.4)}}
.deal{display:grid;grid-template-columns:repeat(5,minmax(0,170px));gap:14px;justify-content:center;width:100%}
@media (max-width:640px){.deal{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}}
.flip{border:0;padding:0;background:none;perspective:900px;aspect-ratio:5/7;width:100%;position:relative;animation:dealin .45s backwards}
@keyframes dealin{from{transform:translateY(60px) scale(.8);opacity:0}}
.flip-in{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.3,.7,.3,1)}
.flip.on .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face.front{transform:rotateY(180deg)}
.back{width:100%;height:100%;border-radius:6.5%/4.6%;position:relative;overflow:hidden;display:grid;place-items:center;
  background:linear-gradient(150deg,#d8e2dc,#7d8f86 45%,#d8e2dc 70%,#7d8f86);padding:1.8cqw;box-shadow:0 2cqw 5cqw -1cqw rgba(0,0,0,.55)}
.back > span{position:absolute;inset:1.8cqw;border-radius:5%/3.6%;display:grid;place-items:center;
  background:repeating-linear-gradient(135deg,rgba(255,255,255,.04) 0 2cqw,transparent 2cqw 4cqw),radial-gradient(circle at 50% 40%,#145c40,#082319 75%)}
.back svg{width:46cqw;height:46cqw;filter:drop-shadow(0 2cqw 4cqw rgba(0,0,0,.5))}
.flip .glow{position:absolute;inset:-6%;border-radius:12%;z-index:-1;opacity:0;transition:opacity .4s .3s}
.flip.on .glow{opacity:1}
.flip.g-R .glow{background:radial-gradient(closest-side,rgba(58,134,240,.75),transparent)}
.flip.g-E .glow{background:radial-gradient(closest-side,rgba(161,89,234,.9),transparent)}
.flip.g-L .glow{background:radial-gradient(closest-side,rgba(255,215,64,1),transparent);animation:pulse 1.6s infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.flip.unseen:not(.on):hover .flip-in{transform:translateY(-6px)}
.hint{font-family:var(--cond);font-weight:700;font-size:18px;color:var(--muted);text-align:center}
.raritycall{font-family:var(--cond);font-weight:900;font-size:30px;font-style:italic;min-height:36px;text-align:center}

.modal{width:100%;max-width:760px;display:grid;grid-template-columns:1fr;gap:22px;align-items:start}
@media (min-width:700px){.modal{grid-template-columns:300px 1fr}}
.modal .bigcard{width:min(78vw,300px);justify-self:center;perspective:900px}
.modal .bigcard .card{transition:transform .15s ease-out;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg))}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}
.fact{background:rgba(255,255,255,.06);border-radius:10px;padding:10px 12px}
.fact span{display:block;font-size:12.5px;color:var(--muted)}
.fact b{font-family:var(--cond);font-size:22px;font-weight:800}
.credit{font-size:12.5px;color:var(--muted);margin-top:14px}

/* ---------- Match ---------- */
.opps{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-top:12px}
.opp{border:1.5px solid var(--line);border-radius:12px;padding:12px;text-align:left;background:linear-gradient(155deg,var(--c1) 62%,var(--c2) 62% 70%,var(--c1) 70%);
  color:#fff;display:flex;flex-direction:column;gap:4px;min-height:92px;text-shadow:0 1px 0 rgba(0,0,0,.4)}

.opp .stars{letter-spacing:2px;font-size:14px}
.opp[aria-pressed="true"]{outline:3px solid var(--gold);outline-offset:2px}
.lineup{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-top:12px}
.lineup > button{border:0;padding:0;background:none}
.versus{display:grid;gap:14px;margin-top:18px}
.round{display:grid;grid-template-columns:104px 1fr 104px;gap:12px;align-items:center;opacity:0;transform:translateY(12px);transition:.35s}
.round.show{opacity:1;transform:none}
.round .mid{text-align:center;font-family:var(--cond)}
.round .mid b{display:block;font-size:26px;font-weight:900}
.round .mid span{font-size:13px;color:var(--muted)}
.round .win{color:var(--rPC)}.round .lose{color:var(--danger)}

.scoreboard small{font-size:15px;font-weight:700;color:var(--muted);display:block;text-align:center}

.mkt{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px;margin-top:14px}
@media (max-width:420px){.mkt{grid-template-columns:repeat(2,1fr)}}
.mkt .item{display:flex;flex-direction:column;gap:10px}

.userchip{border:1px solid var(--line);background:rgba(255,255,255,.07)}

@media (max-width:480px){.userchip .uname{display:none}.userchip{padding:5px 7px}.top .logo .wm span{display:none}}

.auth .switch{display:grid;grid-template-columns:1fr 1fr;background:rgba(0,0,0,.25);border-radius:10px;padding:4px}

.auth .switch button[aria-pressed="true"]{background:var(--chalk);color:var(--deep)}
.field{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600}
.field input{font:inherit;font-weight:400;font-size:16px;color:var(--chalk);background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:9px;padding:11px 12px}
.field input:focus{border-color:var(--gold);outline:none}
.field small{font-weight:400;color:var(--muted)}
.formerr{color:#ff9b9e;font-size:14px;min-height:1em;margin:0}
.syncdot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;background:var(--muted)}

.toast[hidden]{display:none}
.odds{width:100%;border-collapse:collapse;font-size:14px;margin-top:10px}
.odds th,.odds td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
.odds td:not(:first-child),.odds th:not(:first-child){text-align:right}
.picker-grid{width:100%;max-width:900px}
.empty{padding:30px 16px;text-align:center;border:1.5px dashed var(--line);border-radius:12px;color:var(--muted)}

@media (prefers-reduced-motion:reduce){

function pickW(weights,rnd=Math.random){const t=Object.values(weights).reduce((a,b)=>a+b,0);let r=rnd()*t;for(const k in weights){r-=weights[k];if(r<=0)return k}return Object.keys(weights).pop()}

  const RANGE = {C:[47,60],PC:[58,68],R:[67,77],E:[77,86],L:[86,94]};

/* Mise à jour des effectifs : un joueur transféré dans un autre club de L1 garde ses cartes,
   un joueur parti hors L1 est converti en jetons (valeur de revente). */
function migrateState(st){
  const bySlug = {}; PLAYERS.forEach(p=>{ bySlug[p.id.slice(p.id.indexOf("-")+1)] = p.id; });
  let refund=0, moved=0, gone=0; const fresh={};
  Object.entries(st.owned||{}).forEach(([id,x])=>{
    if(!x||!(x.n+x.s)) return;
    let nid = P[id] ? id : bySlug[id.slice(id.indexOf("-")+1)];
    if(nid){ const o=fresh[nid]||(fresh[nid]={n:0,s:0}); o.n+=x.n; o.s+=x.s; if(nid!==id) moved++; }
    else { refund += (x.n*30)+(x.s*120); gone++; }
  });
  st.owned = fresh;
  st.history = (st.history||[]).filter(id=>P[id]);
  st.lineup = (st.lineup||[]).map(c=>c&&P[c.id]?c:null);
  if(st.market&&st.market.items&&st.market.items.some(it=>!P[it.id])) st.market={date:"",items:[]};
  if(refund){ st.coins += refund; st.earned = (st.earned||0)+refund; }
  return {refund,moved,gone};
}

/* =====================================================================
   COMPTES — JSONBin
   Un bin « annuaire » liste les comptes (pseudo, sel, empreinte du mot
   de passe, id du bin de sauvegarde). Chaque joueur a son propre bin.
   Les mots de passe ne sont jamais stockés : seulement une empreinte
   PBKDF2-SHA256 salée.
   ===================================================================== */
const JSONBIN = {
  base: "https://api.jsonbin.io/v3",
  indexBin: "6ac0fa37ac6210605a0f7761",
  key: "$2a$10$PJUxo9zOil/sgKOBLqYDU.VTEkXUWnGwnYz9Z.UrfPm5iOCKBSe1S",
  keyHeader: "X-Master-Key"          // mettre "X-Access-Key" si tu utilises une clé d'accès limitée
};
const SESSION_KEY = "carton-plein-session", WELCOME_KEY = "carton-plein-welcomed";

try{SESSION = JSON.parse(localStorage.getItem(SESSION_KEY)||"null")}catch(e){SESSION=null}
let SYNC = {state: SESSION?"ok":"idle", at:0, err:""};

async function jb(method, path, body, opt={}){
  const headers = {"Content-Type":"application/json",[JSONBIN.keyHeader]:JSONBIN.key, ...(opt.headers||{})};
  let r;
  try{ r = await fetch(JSONBIN.base+path,{method,headers,body:body===undefined?undefined:JSON.stringify(body),keepalive:!!opt.keepalive}); }
  catch(e){ throw new Error("Serveur de comptes injoignable. Vérifie ta connexion internet."); }
  let j=null; try{ j = await r.json(); }catch(e){}
  if(!r.ok){
    const m = (j&&j.message)||"";
    if(r.status===401) throw new Error("Clé JSONBin refusée. Vérifie la clé dans la configuration du jeu.");
    if(r.status===403 && /exhausted/i.test(m)) throw new Error("Quota de requêtes JSONBin épuisé pour ce mois.");
    if(r.status===403 && /100kb/i.test(m)) throw new Error("Sauvegarde trop volumineuse pour JSONBin (100 Ko max).");
    if(r.status===404) throw new Error("Sauvegarde introuvable sur le serveur.");
    if(r.status===429) throw new Error("Trop de requêtes, réessaie dans un instant.");
    throw new Error(m || ("Erreur serveur "+r.status));
  }
  return j;
}
const readBin = id => jb("GET",`/b/${id}/latest`,undefined,{headers:{"X-Bin-Meta":"false"}});
async function readIndex(){ const r = await readBin(JSONBIN.indexBin); const rec = (r&&typeof r==="object"&&!Array.isArray(r))?r:{}; if(!rec.users||typeof rec.users!=="object") rec.users={}; return rec; }

/* --- mots de passe --- */
const toB64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const fromB64 = s => Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function hashPw(pw,saltB64){
  if(!(window.crypto&&crypto.subtle)) throw new Error("Ce navigateur ne permet pas le chiffrement nécessaire aux comptes.");
  const k = await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);
  const bits = await crypto.subtle.deriveBits({name:"PBKDF2",salt:fromB64(saltB64),iterations:150000,hash:"SHA-256"},k,256);
  return toB64(bits);
}
const newSalt = () => toB64(crypto.getRandomValues(new Uint8Array(16)));

/* --- format de sauvegarde compact (reste loin des 100 Ko) --- */
const SYNC_FIELDS = ["coins","packs","lastRefill","opened","pity","earned","market","daily","history","lineup","opp","wins","draws","losses","updatedAt"];
function packSave(){
  const o = {v:1};
  SYNC_FIELDS.forEach(k=>o[k]=S[k]);
  o.own = Object.entries(S.owned).filter(([id,x])=>P[id]&&(x.n+x.s)>0).map(([id,x])=>id+":"+x.n+(x.s?"."+x.s:"")).join(";");
  return o;
}
function unpackSave(o){
  const st = freshState();
  SYNC_FIELDS.forEach(k=>{ if(o[k]!==undefined) st[k]=o[k]; });
  st.owned = {};
  (o.own||"").split(";").filter(Boolean).forEach(t=>{ const [id,v]=t.split(":"); const [n,sh]=(v||"0").split(".");
    st.owned[id]={n:+n||0,s:+sh||0}; });
  migrateState(st);
  st.view = S ? S.view : "home";
  return st;
}

function syncLabel(){
  const t = SYNC.at ? new Date(SYNC.at).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"}) : "";
  const txt = {ok:SYNC.at?`Synchronisé à ${t}`:"Synchronisé",pending:"Modifications en attente d’envoi",saving:"Envoi en cours…",error:"Échec de synchronisation : "+esc(SYNC.err),idle:""}[SYNC.state];

function scheduleSync(){
  if(!SESSION) return;
  setSync("pending");
  clearTimeout(syncT); syncT = setTimeout(()=>pushNow(), SYNC_DELAY);
}
async function pushNow(keepalive=false){
  if(!SESSION) return;
  clearTimeout(syncT); syncT=null;
  setSync("saving");
  try{ await jb("PUT",`/b/${SESSION.bin}`,packSave(),{keepalive}); setSync("ok"); }
  catch(e){ setSync("error",e.message); }
}
async function pullOnStart(){

    if(cloud && (cloud.updatedAt||0) > (S.updatedAt||0)){ S = unpackSave(cloud); saveLocalOnly(); render(); toast("Progression récupérée depuis ton compte"); setSync("ok"); }

const PSEUDO_RE = /^[A-Za-z0-9_.-]{3,20}$/;
function hasGuestProgress(){ return Object.values(S.owned).some(x=>x.n+x.s>0); }
function setSession(sess){ SESSION=sess; try{ sess?localStorage.setItem(SESSION_KEY,JSON.stringify(sess)):localStorage.removeItem(SESSION_KEY);}catch(e){} }

async function signup(pseudo,pw){
  if(!PSEUDO_RE.test(pseudo)) throw new Error("Pseudo : 3 à 20 caractères, lettres, chiffres, point, tiret ou tiret bas.");
  if(pw.length<6) throw new Error("Le mot de passe doit faire au moins 6 caractères.");
  const key = pseudo.toLowerCase();
  let idx = await readIndex();
  if(idx.users[key]) throw new Error("Ce pseudo est déjà pris.");
  const salt = newSalt(), h = await hashPw(pw,salt);
  S.updatedAt = Date.now();
  const created = await jb("POST","/b",packSave(),{headers:{"X-Bin-Private":"true","X-Bin-Name":"swaps-"+key}});
  const bin = created&&created.metadata&&created.metadata.id;
  if(!bin) throw new Error("Le serveur n’a pas créé la sauvegarde.");
  idx = await readIndex();                       // relecture juste avant d'écrire, pour ne pas écraser un autre compte
  if(idx.users[key]){ jb("DELETE",`/b/${bin}`).catch(()=>{}); throw new Error("Ce pseudo vient d’être pris."); }
  idx.users[key] = {p:pseudo,s:salt,h,b:bin,c:new Date().toISOString()};
  await jb("PUT",`/b/${JSONBIN.indexBin}`,idx);
  setSession({pseudo,key,bin}); saveLocalOnly(); setSync("ok");
}
async function login(pseudo,pw){
  const key = pseudo.trim().toLowerCase();
  const idx = await readIndex();
  const u = idx.users[key];
  if(!u || await hashPw(pw,u.s)!==u.h) throw new Error("Pseudo ou mot de passe incorrect.");
  const cloud = await readBin(u.b);
  setSession({pseudo:u.p,key,bin:u.b});
  S = unpackSave(cloud||{}); saveLocalOnly(); setSync("ok");
}
async function logout(){
  if(syncT) await pushNow();
  setSession(null); S = freshState(); S.view="profile"; saveLocalOnly(); SYNC={state:"idle",at:0,err:""};
}
async function deleteAccount(pw){
  const idx = await readIndex(); const u = idx.users[SESSION.key];
  if(!u || await hashPw(pw,u.s)!==u.h) throw new Error("Mot de passe incorrect.");
  await jb("DELETE",`/b/${u.b}`).catch(()=>{});
  const idx2 = await readIndex(); delete idx2.users[SESSION.key];
  await jb("PUT",`/b/${JSONBIN.indexBin}`,idx2);
  clearTimeout(syncT); syncT=null;
  setSession(null); S=freshState(); S.view="profile"; saveLocalOnly(); SYNC={state:"idle",at:0,err:""};
}

/* ---------- économie & boosters ---------- */
function refill(){
  const now = Date.now();
  if(S.packs>=MAX_STOCK){S.lastRefill=now;return}
  const n = Math.floor((now-S.lastRefill)/REFILL_MS);
  if(n>0){S.packs=Math.min(MAX_STOCK,S.packs+n);S.lastRefill+=n*REFILL_MS;if(S.packs>=MAX_STOCK)S.lastRefill=now;save()}
}
function msToNext(){return S.packs>=MAX_STOCK?0:Math.max(0,REFILL_MS-(Date.now()-S.lastRefill))}
const own = id => S.owned[id] || {n:0,s:0};
const ownedCount = id => {const o=own(id);return o.n+o.s};
const isOwned = id => ownedCount(id)>0;
function addCard(id,shiny){const o=S.owned[id]||(S.owned[id]={n:0,s:0}); if(shiny)o.s++; else o.n++;}
function collectedIn(list){return list.filter(p=>isOwned(p.id)).length}

function drawPlayer(rar,clubId){
  let order = RKEYS.slice(0,RKEYS.indexOf(rar)+1).reverse(); // repli vers le bas si vide
  for(const r of order){
    let pool = BY_RAR[r]; if(clubId) pool = pool.filter(p=>p.club===clubId);
    if(!pool.length) continue;
    const missing = pool.filter(p=>!isOwned(p.id));
    if(missing.length && Math.random()<.35) pool = missing;
    return pool[Math.floor(Math.random()*pool.length)];
  }
  return PLAYERS[0];
}
function makePack(kind,clubId){
  const out=[];
  const pity = kind!=="prestige" && S.pity>=9;
  for(let i=0;i<5;i++){
    let w;
    if(kind==="prestige") w = i===4?PRESTIGE_LAST:PRESTIGE_SLOTS;
    else w = i===4 ? (pity?{E:85,L:15}:PACK_LAST_SLOT) : PACK_FREE_SLOTS;
    const p = drawPlayer(pickW(w), clubId);
    out.push({id:p.id,shiny:Math.random()<SHINY_RATE});
  }
  const best = Math.max(...out.map(c=>RAR[P[c.id].rar].rank));
  if(kind!=="prestige") S.pity = best>=3?0:S.pity+1;
  out.forEach(c=>{c.isNew=!isOwned(c.id)});
  // marquer « nouveau » une seule fois par joueur dans le paquet
  const seen=new Set(); out.forEach(c=>{if(c.isNew&&seen.has(c.id))c.isNew=false;seen.add(c.id)});
  out.forEach(c=>addCard(c.id,c.shiny));
  out.sort((a,b)=>RAR[P[a.id].rar].rank-RAR[P[b.id].rar].rank || (a.shiny-b.shiny));
  S.opened++;
  S.history = out.map(c=>c.id).concat(S.history).slice(0,30);
  save();
  return out;
}
function sellValue(id,shiny){return RAR[P[id].rar].sell*(shiny?4:1)}
function addCoins(n){S.coins+=n;S.earned+=Math.max(0,n)}

/* =====================================================================
   PHOTOS LIBRES DE DROITS
   Article Wikipédia du joueur → fiche Wikidata (propriété P18, toujours
   hébergée sur Wikimedia Commons) → licence vérifiée sur Commons.
   Seules les licences libres sont acceptées (CC0, CC BY, CC BY-SA,
   domaine public, GFDL, Art libre). Les images sont gardées dans
   IndexedDB pour fonctionner ensuite hors ligne.
   ===================================================================== */
const BAD_TITLE = /(football club|\bfc\b|\bac\b|saison|liste|homonymie|championnat|ligue|coupe|equipe|stade|olympique|association|club)/i;
const FREE_LIC = /(cc0|cc[ -]?by|public domain|domaine public|^pd|gfdl|copyrighted free use|art libre|\bfal\b|attribution)/i;
const NONFREE_LIC = /(\bnc\b|\bnd\b|non[- ]?free|fair use)/i;
const textOf = html => html ? (new DOMParser().parseFromString(html,"text/html").body.textContent||"").replace(/\s+/g," ").trim() : "";
async function getJSON(url){const r=await fetch(url);if(!r.ok)throw new Error("http "+r.status);return r.json()}

async function findArticles(p,lang){
  const q = lang==="fr" ? p.nom+" footballeur" : p.nom+" footballer";
  const j = await getJSON(`https://${lang}.wikipedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrnamespace=0&gsrlimit=5`+
    `&gsrsearch=${encodeURIComponent(q)}&prop=pageprops&ppprop=wikibase_item&redirects=1`);
  const pages = Object.values((j.query&&j.query.pages)||{}).sort((a,b)=>a.index-b.index);
  const key = norm(p.famille).split(/[\s-]+/).filter(w=>w.length>2).pop() || norm(p.famille);
  return pages.filter(pg=>pg.pageprops&&pg.pageprops.wikibase_item && norm(pg.title).includes(key) && !BAD_TITLE.test(pg.title.replace(p.nom,"")))
    .map(pg=>({t:pg.title,q:pg.pageprops.wikibase_item,l:lang}));
}
const claimIds = (e,prop) => ((e.claims&&e.claims[prop])||[]).map(c=>c.mainsnak&&c.mainsnak.datavalue&&c.mainsnak.datavalue.value).filter(Boolean);
async function wikidataPick(cands){
  const j = await getJSON(`https://www.wikidata.org/w/api.php?action=wbgetentities&format=json&origin=*&props=claims&ids=${cands.map(c=>c.q).join("|")}`);
  for(const c of cands){
    const e = j.entities&&j.entities[c.q]; if(!e) continue;
    const isFoot = claimIds(e,"P106").some(v=>v.id==="Q937857") || claimIds(e,"P641").some(v=>v.id==="Q2736");
    if(!isFoot) continue;                       // on ne garde qu'un footballeur
    const file = claimIds(e,"P18")[0] || null;  // image principale (Commons)
    const cat = claimIds(e,"P373")[0] || null;  // catégorie Commons du joueur
    return {...c,file,cat};
  }
  return null;
}
const COMMONS = "https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*";
const II = "&prop=imageinfo&iiprop=url|extmetadata|mime|size&iiurlwidth=480&iiextmetadatafilter=LicenseShortName|Artist|Credit";
const BAD_FILE = /(logo|crest|blason|ecusson|kit|maillot|jersey|shirt|stad|team|squad|equipe|lineup|line-up|mannschaft|signature|autograph|map|carte|flag|drapeau|trophy|troph)/i;
function infoFromPage(pg){
  const ii = pg&&pg.imageinfo&&pg.imageinfo[0]; if(!ii) return null;
  if(ii.mime && !/^image\/(jpeg|png|webp)$/.test(ii.mime)) return null;
  const md = ii.extmetadata||{};
  const lic = (md.LicenseShortName&&md.LicenseShortName.value)||"";
  if(!FREE_LIC.test(lic) || NONFREE_LIC.test(lic)) return null;   // licence non libre : refusée
  const art = textOf(md.Artist&&md.Artist.value) || textOf(md.Credit&&md.Credit.value) || "Auteur inconnu";
  return {u:ii.thumburl||ii.url, lic, art:art.slice(0,120), src:ii.descriptionurl, file:(pg.title||"").replace(/^File:/,""), w:ii.width, h:ii.height};
}
async function commonsInfo(file){
  const j = await getJSON(COMMONS+II+`&titles=${encodeURIComponent("File:"+file)}`);
  return infoFromPage(Object.values((j.query&&j.query.pages)||{})[0]);
}
const nameTokens = p => norm(p.nom).split(/[^a-z0-9]+/).filter(w=>w.length>2);
function bestFile(pages,p,needAll){
  const toks = nameTokens(p), fam = norm(p.famille).split(/[^a-z0-9]+/).filter(w=>w.length>2);
  const list = pages.map(pg=>({pg,info:infoFromPage(pg),t:norm(pg.title||"")}))
    .filter(x=>x.info && !BAD_FILE.test(x.t) && (needAll ? toks.every(w=>x.t.includes(w)) : fam.some(w=>x.t.includes(w))));
  // préférence : portrait plutôt que paysage, puis ordre de l'API
  list.sort((a,b)=>((b.info.h||1)/(b.info.w||1)>1.05)-((a.info.h||1)/(a.info.w||1)>1.05) || (a.pg.index||0)-(b.pg.index||0));
  return list.length ? list[0].info : null;
}
// Photos rangées dans la catégorie Commons du joueur (propriété Wikidata P373)
async function commonsCategoryImage(cat,p){
  const j = await getJSON(COMMONS+II+`&generator=categorymembers&gcmtype=file&gcmlimit=30&gcmtitle=${encodeURIComponent("Category:"+cat)}`);
  return bestFile(Object.values((j.query&&j.query.pages)||{}),p,false);
}
// Dernier recours : recherche par nom complet dans Commons (le nom entier doit figurer dans le titre du fichier)
async function commonsSearchImage(p){
  const j = await getJSON(COMMONS+II+`&generator=search&gsrnamespace=6&gsrlimit=15&gsrsearch=${encodeURIComponent('"'+p.nom+'" filetype:bitmap')}`);
  return bestFile(Object.values((j.query&&j.query.pages)||{}),p,true);
}
async function lookupPhoto(p){
  const seen=new Set(); let wd=null;
  for(const lang of ["fr","en"]){
    const cands = (await findArticles(p,lang)).filter(c=>!seen.has(c.q)); cands.forEach(c=>seen.add(c.q));
    if(!cands.length) continue;
    wd = await wikidataPick(cands);
    if(wd) break;
  }
  const meta = wd ? {t:wd.t,l:wd.l,q:wd.q} : {};
  if(wd && wd.file){ const info = await commonsInfo(wd.file); if(info) return {...info,...meta}; }
  if(wd && wd.cat){ const info = await commonsCategoryImage(wd.cat,p); if(info) return {...info,...meta,via:"cat"}; }
  const found = await commonsSearchImage(p);
  if(found) return {...found,...meta,via:"search"};
  return wd ? {u:null,...meta} : null;
}

/* ---------- stockage hors ligne (IndexedDB) ---------- */
let dbP=null;
function idb(){ if(!("indexedDB" in window)) return Promise.reject(new Error("no idb"));
  if(!dbP) dbP=new Promise((res,rej)=>{const r=indexedDB.open("carton-plein",1);r.onupgradeneeded=()=>r.result.createObjectStore("photos");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
  return dbP; }
function idbReq(mode,fn){return idb().then(d=>new Promise((res,rej)=>{const r=fn(d.transaction("photos",mode).objectStore("photos"));r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}))}
const idbGet=k=>idbReq("readonly",s=>s.get(k)), idbPut=(k,v)=>idbReq("readwrite",s=>s.put(v,k)),
      idbClear=()=>idbReq("readwrite",s=>s.clear()), idbCount=()=>idbReq("readonly",s=>s.count());

const BLOBURL={}, blobJobs={};
function ensureBlob(id){
  if(BLOBURL[id]) return Promise.resolve(BLOBURL[id]);
  if(blobJobs[id]) return blobJobs[id];
  return blobJobs[id]=(async()=>{
    try{const b=await idbGet(id); if(b) return BLOBURL[id]=URL.createObjectURL(b)}catch(e){}
    const c=PHOTOS[id]; if(!c||!c.u) return null;
    try{const r=await fetch(c.u); if(r.ok){const b=await r.blob(); if(b.type.startsWith("image/")){try{await idbPut(id,b)}catch(e){} return BLOBURL[id]=URL.createObjectURL(b)}}}catch(e){}
    return c.u;   // repli : affichage direct depuis Commons
  })().finally(()=>{delete blobJobs[id]});
}
async function applyPhoto(id){
  const src = await ensureBlob(id); if(!src) return;
  document.querySelectorAll(`img[data-pid="${id}"]`).forEach(img=>{
    if(img.getAttribute("src")!==src){img.onload=()=>img.classList.add("ok");img.onerror=()=>{};img.src=src}
  });
}
const fresh = c => c && (c.u || Date.now()-c.ts<7*864e5);
async function lookupAndStore(id){
  if(!fresh(PHOTOS[id])){
    const res = await lookupPhoto(P[id]);         // lève une erreur si hors ligne : rien n'est mis en cache
    PHOTOS[id] = res ? {...res,ts:Date.now()} : {u:null,ts:Date.now()};
    savePhotos();
  }
  if(PHOTOS[id].u) await applyPhoto(id);
}
const queue=[]; let running=0; const pending=new Set();
function requestPhoto(id){
  if(pending.has(id)) return;
  if(fresh(PHOTOS[id])){ if(PHOTOS[id].u) applyPhoto(id); return; }
  pending.add(id); queue.push(id); pump();
}
function pump(){
  while(running<4 && queue.length){
    const id = queue.shift(); running++;
    lookupAndStore(id).catch(()=>{}).finally(()=>{running--;pending.delete(id);pump()});
  }
}
const io = "IntersectionObserver" in window ? new IntersectionObserver(es=>{
  es.forEach(e=>{if(e.isIntersecting){io.unobserve(e.target);requestPhoto(e.target.dataset.pid)}});
},{rootMargin:"200px"}) : null;
function hydrate(root=document){
  root.querySelectorAll("img[data-pid]:not([src])").forEach(img=>{
    const id=img.dataset.pid;
    if(BLOBURL[id]||(PHOTOS[id]&&PHOTOS[id].u)){applyPhoto(id);return}
    if(io) io.observe(img); else requestPhoto(id);
  });
}
async function preloadAll(){
  const ids=PLAYERS.map(p=>p.id), total=ids.length; let done=0, fails=0;
  const btn=$("#dlAll"); if(btn) btn.disabled=true;
  const upd=()=>{const el=$("#dlProg"); if(el) el.textContent=`${done} / ${total} joueurs traités…`};
  upd();
  const worker=async()=>{while(ids.length){const id=ids.shift(); try{await lookupAndStore(id)}catch(e){fails++} done++; upd()}};
  await Promise.all([worker(),worker(),worker(),worker()]);
  toast(fails===total?"Pas de connexion : aucune photo téléchargée":`Photos téléchargées (${Object.values(PHOTOS).filter(x=>x.u).length} trouvées)`);
  if(S.view==="profile") render();
}

function ensureMarket(){
  if(S.market.date===today() && S.market.items.length) return;
  const rnd = seeded("marche-"+today());
  const plan = [pickW({PC:60,R:40},rnd), "R", pickW({R:40,E:60},rnd), pickW({E:75,L:25},rnd)];
  const items=[], used=new Set();
  plan.forEach(r=>{
    let pool = BY_RAR[r].filter(p=>!used.has(p.id));
    const miss = pool.filter(p=>!isOwned(p.id));
    if(miss.length && rnd()<.7) pool=miss;
    const p = pool[Math.floor(rnd()*pool.length)]; used.add(p.id);
    items.push({id:p.id,price:Math.round(RAR[r].buy*(0.85+rnd()*.3)/5)*5,sold:false});
  });
  S.market={date:today(),items}; save();
}

function clubStrength(cid){const l=PLAYERS.filter(p=>p.club===cid).map(p=>power(p)).sort((a,b)=>b-a).slice(0,5);return l.reduce((a,b)=>a+b,0)/5}
const STR = {}; CLUBS.forEach(c=>STR[c.id]=clubStrength(c.id));
const STRMIN=Math.min(...Object.values(STR)), STRMAX=Math.max(...Object.values(STR));
const stars = cid => Math.max(1,Math.round(1+(STR[cid]-STRMIN)/(STRMAX-STRMIN)*4));
function bestLineup(){
  const cards=[];
  PLAYERS.forEach(p=>{const o=own(p.id); if(o.s) cards.push({id:p.id,shiny:true}); else if(o.n) cards.push({id:p.id,shiny:false})});
  cards.sort((a,b)=>power(P[b.id],b.shiny)-power(P[a.id],a.shiny));
  return [0,1,2,3,4].map(i=>cards[i]||null);
}
function viewMatch(){

      ${crestSVG(c.id,"crest oppcrest")}<b>${esc(c.nom)}</b><span class="stars" aria-label="Difficulté ${stars(c.id)} sur 5">${"★".repeat(stars(c.id))}${"☆".repeat(5-stars(c.id))}</span>
      <span style="font-size:13px">Victoire : ${winReward(c.id)} jetons</span></button>`).join("")}</div>

const winReward = cid => 30 + stars(cid)*15;
function playMatch(){
  const cid=S.opp, rnd=Math.random;
  const pool = PLAYERS.filter(p=>p.club===cid).sort((a,b)=>power(b)-power(a)).slice(0,11);
  const opp=[]; while(opp.length<5){const p=pool[Math.floor(rnd()*pool.length)]; if(!opp.includes(p)) opp.push(p)}
  opp.sort((a,b)=>power(b)-power(a));
  let me=0, them=0;
  const rounds = S.lineup.map((c,i)=>{
    const mine=P[c.id], k=c.shiny?1.1:1, o=opp[i];
    const attack = i%2===0;
    const a = attack ? mine.atk*k*(.85+rnd()*.3) : o.atk*(.85+rnd()*.3);
    const d = attack ? o.def*(.85+rnd()*.3) : mine.def*k*(.85+rnd()*.3);
    let res;
    if(attack){ res = a>d*1.03?"win":a<d*0.97?"lose":"draw"; }
    else { res = a>d*1.03?"lose":a<d*0.97?"win":"draw"; }
    if(res==="win") me++; if(res==="lose") them++;
    return {c,o,attack,a:Math.round(a),d:Math.round(d),res};
  });
  const outcome = me>them?"win":me<them?"lose":"draw";
  let reward=0;
  if(S.daily.matches<MATCH_REWARDS_PER_DAY){reward = outcome==="win"?winReward(cid):outcome==="draw"?15:5; S.daily.matches++; addCoins(reward)}
  if(outcome==="win")S.wins++;else if(outcome==="draw")S.draws++;else S.losses++;
  save(); renderHeader();
  const c=CLUB[cid];
  openOv(`<div class="stage">
    <div class="scoreboard"><div><small>Toi</small><span id="sMe">0</span></div><span style="opacity:.4">–</span><div><small>${esc(c.court)}</small><span id="sThem">0</span></div></div>
    <div class="versus" style="width:100%;max-width:640px">${rounds.map((r,i)=>`
      <div class="round" data-r="${i}">
        <div>${cardHTML(r.c.id,{shiny:r.c.shiny})}</div>
        <div class="mid"><span>Manche ${i+1} · ${r.attack?"tu attaques":"tu défends"}</span>
          <b class="${r.res}">${r.res==="win"?"Gagnée":r.res==="lose"?"Perdue":"Égalité"}</b>
          <span>${r.attack?`ATK ${r.a} contre DEF ${r.d}`:`ATK ${r.a} contre ta DEF ${r.d}`}</span></div>
        <div>${cardHTML(r.o.id)}</div>
      </div>`).join("")}</div>
    <div class="raritycall" id="mRes" style="opacity:0">${outcome==="win"?"Victoire":outcome==="draw"?"Match nul":"Défaite"}${reward?` · +${reward} jetons`:""}</div>
    <div class="row" style="justify-content:center"><button class="btn" data-close>Fermer</button><button class="btn ghost" id="again">Rejouer</button></div>
  </div>`);
  hydrate($("#ov"));
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let m=0,t=0;
  rounds.forEach((r,i)=>setTimeout(()=>{
    document.querySelector(`.round[data-r="${i}"]`).classList.add("show");
    if(r.res==="win")m++; if(r.res==="lose")t++;
    $("#sMe").textContent=m; $("#sThem").textContent=t;
    if(i===4) $("#mRes").style.opacity=1;
  }, reduce?0:i*750+300));
  $("#again").onclick=()=>{closeOv();playMatch()};
}
function openPicker(slot){
  const used = new Set(S.lineup.filter((c,i)=>c&&i!==slot).map(c=>c.id));
  const cards=[];
  PLAYERS.forEach(p=>{if(used.has(p.id))return;const o=own(p.id); if(o.s) cards.push({id:p.id,shiny:true}); if(o.n) cards.push({id:p.id,shiny:false})});
  cards.sort((a,b)=>power(P[b.id],b.shiny)-power(P[a.id],a.shiny));
  openOv(`<div class="stage picker-grid" style="justify-content:flex-start">
    <h2>Choisir le joueur ${slot+1}</h2>
    <div class="grid" style="width:100%">${cards.map((c,i)=>`<button data-pick="${i}">${cardHTML(c.id,{shiny:c.shiny})}</button>`).join("")}</div>
  </div>`);
  hydrate($("#ov"));
  $("#ov").querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>{S.lineup[slot]=cards[+b.dataset.pick];save();closeOv();render()});
}

    <p class="muted">Par carte, dans un booster Ligue 1. La 5ᵉ carte est toujours Peu commune ou mieux, et après 9 boosters sans Épique, le 10ᵉ en garantit une. Chaque carte a ${SHINY_RATE*100} % de chances d’être brillante (stats +10 %).</p>
    <table class="odds"><thead><tr><th>Rareté</th><th>Joueurs</th><th>Cartes 1 à 4</th><th>Carte 5</th></tr></thead><tbody>
      ${RKEYS.slice().reverse().map(k=>`<tr><td>${RAR[k].nom}</td><td>${BY_RAR[k].length}</td><td>${PACK_FREE_SLOTS[k]||0} %</td><td>${PACK_LAST_SLOT[k]||0} %</td></tr>`).join("")}
    </tbody></table>
  </section>
  <section class="section">
    <h2>Sauvegarde</h2>
    <p class="muted">La partie est enregistrée dans ce navigateur. Exporte-la pour la garder ou la transférer sur un autre appareil.</p>
    <div class="row"><button class="btn small" id="exp">Exporter la sauvegarde</button>
      <label class="btn small ghost" style="cursor:pointer">Importer une sauvegarde<input type="file" id="imp" accept="application/json,.json" hidden></label>
      <button class="btn small danger" id="reset">Recommencer à zéro</button></div>
  </section>
  <section class="section">
    <h2>Photos</h2>
    <p class="muted">Uniquement des photos sous licence libre (CC0, CC BY, CC BY-SA, domaine public…), prises sur Wikimedia Commons via la fiche Wikidata de chaque joueur. Une photo sans licence libre vérifiée n’est jamais affichée : la carte montre alors les initiales du joueur.</p>
    <p class="muted">${photosOk} photo${photosOk>1?"s":""} trouvée${photosOk>1?"s":""} sur ${TOTAL} joueurs. Une fois téléchargées, elles restent disponibles hors ligne.</p>
    <div class="row"><button class="btn small" id="dlAll">Télécharger toutes les photos</button>
      <button class="btn small ghost" id="clearPh">Vider le cache des photos</button></div>
    <p class="muted" id="dlProg" aria-live="polite"></p>
    ${photosOk?`<details style="margin-top:12px"><summary style="cursor:pointer;font-weight:600">Crédits photos (${photosOk})</summary>
      <ul style="font-size:13px;line-height:1.5;color:var(--muted);padding-left:18px">${PLAYERS.filter(p=>PHOTOS[p.id]&&PHOTOS[p.id].u).map(p=>{const c=PHOTOS[p.id];
        return `<li><b style="color:var(--chalk)">${esc(p.nom)}</b> — ${esc(c.art)}, ${esc(c.lic)}, <a href="${esc(c.src)}" target="_blank" rel="noopener">Commons</a></li>`}).join("")}</ul></details>`:""}
  </section>
  <p class="credit">Effectifs de la saison 2026-2027 après la fermeture du mercato d’été (état au 3 octobre 2026). Raretés et statistiques propres au jeu. Jeu non officiel, sans lien avec la LFP ni les clubs.</p>`;
}

/* =====================================================================
   OUVERTURE DE BOOSTER
   ===================================================================== */
function openOv(html){const o=$("#ov");o.innerHTML=`<button class="close-x" data-close aria-label="Fermer">×</button>`+html;o.hidden=false;document.body.style.overflow="hidden"}
function closeOv(){const o=$("#ov");o.hidden=true;o.innerHTML="";document.body.style.overflow=""}

function startPack(kind,clubId){
  const cards = makePack(kind,clubId);
  render();
  openOv(`<div class="stage">
    <div class="hint" id="pHint">Touche le booster pour l’ouvrir</div>
    <button class="pack-big" id="tear" aria-label="Déchirer le booster" style="--glow:${kind==="club"?CLUB[clubId].c1:kind==="prestige"?"#f3c94a":"#2fd38f"}">
      ${packHTML(kind,clubId)}
    </button>
    <div class="raritycall" id="call"></div>
    <div class="deal" id="deal" hidden></div>
    <div class="row" id="pActions" hidden style="justify-content:center"></div>
  </div>`);
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  $("#tear").onclick = ()=>{
    $("#tear").classList.add("torn"); $("#tear").disabled=true;
    setTimeout(()=>{
      $("#tear").remove(); $("#pHint").textContent="Retourne les cartes";
      const deal=$("#deal"); deal.hidden=false;
      deal.innerHTML = cards.map((c,i)=>{const r=P[c.id].rar;
        return `<button class="flip unseen g-${r}" data-i="${i}" style="animation-delay:${i*90}ms" aria-label="Retourner la carte ${i+1}">
          <span class="glow"></span>
          <span class="flip-in"><span class="face"><span class="back"><span>${LOGO_SVG}</span></span></span>
          <span class="face front">${cardHTML(c.id,{shiny:c.shiny,badge:c.isNew?"Nouveau":"×"+ownedCount(c.id),badgeNew:c.isNew})}</span></span>
        </button>`}).join("");
      hydrate(deal);
      cards.forEach(c=>requestPhoto(c.id));
      let left=cards.length;
      const flip=(b)=>{ if(b.classList.contains("on"))return; b.classList.add("on"); b.classList.remove("unseen");
        const c=cards[+b.dataset.i], r=P[c.id].rar;
        if(RAR[r].rank>=2||c.shiny){$("#call").textContent=(c.shiny?"Brillante ! ":"")+(RAR[r].rank>=2?RAR[r].nom+" !":"");$("#call").style.color=r==="L"?"var(--gold)":r==="E"?"#c69bff":r==="R"?"#7fb0ff":"var(--chalk)"}
        if(--left===0) done(); };
      deal.querySelectorAll(".flip").forEach(b=>b.onclick=()=>{ if(b.classList.contains("on")) showCard(cards[+b.dataset.i].id); else flip(b)});
      const act=$("#pActions"); act.hidden=false;
      act.innerHTML=`<button class="btn ghost" id="flipAll">Tout retourner</button>`;
      $("#flipAll").onclick=()=>{deal.querySelectorAll(".flip:not(.on)").forEach((b,i)=>setTimeout(()=>flip(b),reduce?0:i*180))};
      function done(){
        const nNew=cards.filter(c=>c.isNew).length;
        $("#pHint").textContent = nNew?`${nNew} nouveau${nNew>1?"x":""} joueur${nNew>1?"s":""} dans l’album`:"Aucun nouveau joueur cette fois";
        act.innerHTML = `<button class="btn" data-close>Terminer</button>${S.packs&&kind==="free"?`<button class="btn gold" id="nextPack">Ouvrir le suivant (${S.packs})</button>`:""}`;
        const np=$("#nextPack"); if(np) np.onclick=()=>{S.packs--;if(S.packs===MAX_STOCK-1)S.lastRefill=Date.now();save();closeOv();startPack("free")};
      }
    }, reduce?0:900);
  };
}

/* ---------- Fiche carte ---------- */
function showCard(id){
  const p=P[id], c=CLUB[p.club], o=own(id), ph=PHOTOS[id];
  const wiki = ph&&ph.t ? `https://${ph.l}.wikipedia.org/wiki/${encodeURIComponent(ph.t.replace(/ /g,"_"))}` : `https://fr.wikipedia.org/w/index.php?search=${encodeURIComponent(p.nom+" footballeur")}`;
  const has = o.n+o.s>0;
  openOv(`<div class="modal">
    <div class="bigcard" id="tilt">${has?cardHTML(id,{shiny:o.s>0}):slotHTML(id)}</div>
    <div>
      <div class="row" style="gap:12px;flex-wrap:nowrap">${crestSVG(c.id,"crest fichecrest")}<h2 style="font-size:32px">${esc(p.nom)}</h2></div>
      <p class="muted" style="margin:6px 0 0">${POS[p.pos]} · ${esc(c.nom)} · carte n° ${pad3(p.num)}</p>
      <div class="facts">
        <div class="fact"><span>Rareté</span><b style="color:${RAR[p.rar].col}">${RAR[p.rar].nom}</b></div>
        <div class="fact"><span>Note</span><b>${p.rating}</b></div>
        <div class="fact"><span>Attaque</span><b>${p.atk}</b></div>
        <div class="fact"><span>Défense</span><b>${p.def}</b></div>
        <div class="fact"><span>Exemplaires</span><b>${o.n}</b></div>
        <div class="fact"><span>Brillantes</span><b>${o.s}</b></div>
      </div>
      <div class="row">
        ${o.n>1||(o.n===1&&o.s>0)?`<button class="btn small" id="sell1">Vendre un exemplaire (+${sellValue(id,false)})</button>`:""}
        ${o.s>1?`<button class="btn small ghost" id="sell1s">Vendre une brillante (+${sellValue(id,true)})</button>`:""}
        <a class="btn small ghost" href="${wiki}" target="_blank" rel="noopener">Voir sur Wikipédia</a>
      </div>
      ${!has?`<p class="muted">Pas encore dans ta collection. Tente un booster ${esc(c.court)} ou garde un œil sur le marché du jour.</p>`:""}
      <p class="credit">${ph&&ph.u?`Photo : ${esc(ph.art)}, licence ${esc(ph.lic)}, via <a href="${esc(ph.src)}" target="_blank" rel="noopener">Wikimedia Commons</a>.`:"Aucune photo sous licence libre trouvée pour ce joueur."}</p>
    </div>
  </div>`);
  hydrate($("#ov"));
  const s1=$("#sell1"); if(s1) s1.onclick=()=>{o.n--;addCoins(sellValue(id,false));save();toast(`+${sellValue(id,false)} jetons`);showCard(id);render()};
  const s2=$("#sell1s"); if(s2) s2.onclick=()=>{o.s--;addCoins(sellValue(id,true));save();toast(`+${sellValue(id,true)} jetons`);showCard(id);render()};
  const t=$("#tilt");
  if(has && !matchMedia("(prefers-reduced-motion: reduce)").matches){
    t.onpointermove=e=>{const r=t.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;
      const card=t.querySelector(".card"); card.style.setProperty("--ry",(x-.5)*18+"deg"); card.style.setProperty("--rx",(.5-y)*18+"deg");
      card.style.setProperty("--hx",x*100+"%");card.style.setProperty("--hy",y*100+"%")};
    t.onpointerleave=()=>{const card=t.querySelector(".card");card.style.setProperty("--ry","0deg");card.style.setProperty("--rx","0deg")};
  }
}

let toastT;
function toast(msg){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2200)}

/* =====================================================================
   ÉVÉNEMENTS
   ===================================================================== */
document.addEventListener("click",e=>{
  const t=e.target.closest("button,label,a"); if(!t) return;
  if(t.matches("[data-close]")){closeOv();render();return}
  if(t.dataset.tab){go(t.dataset.tab);return}
  if(t.dataset.auth){authMode=t.dataset.auth;const form=t.closest("form");const ctx=form.dataset.ctx;form.outerHTML=authHTML(ctx);return}
  if(t.id==="syncNow"){pushNow().then(()=>toast(SYNC.state==="ok"?"Collection sauvegardée en ligne":"Échec : "+SYNC.err));return}
  if(t.id==="logout"){if(!confirm("Se déconnecter ? Ta collection reste sauvegardée sur ton compte."))return;logout().then(()=>{render();toast("Déconnecté")});return}
  if(t.id==="delAcc"){const pw=prompt("Suppression définitive du compte et de sa collection.\nTape ton mot de passe pour confirmer :");if(!pw)return;
    deleteAccount(pw).then(()=>{render();toast("Compte supprimé")}).catch(e=>toast(e.message));return}
  if(t.dataset.card && !t.closest(".flip")){showCard(t.dataset.card);return}
  if(t.id==="openFree"){refill();if(!S.packs)return;S.packs--;if(S.packs===MAX_STOCK-1)S.lastRefill=Date.now();save();startPack("free");return}
  if(t.dataset.buy){
    const k=t.dataset.buy, cost=k==="club"?COST_CLUB:k==="prestige"?COST_PRESTIGE:COST_FREEPACK;
    if(S.coins<cost) return; S.coins-=cost; save();
    startPack(k, k==="club"?$("#clubSel").value:null); return;
  }
  if(t.dataset.club){S.albumClub=t.dataset.club;save();render();return}
  if(t.id==="fMiss"){S.albumMissing=!S.albumMissing;save();render();return}
  if(t.id==="sellDupes"){
    let g=0,n=0; PLAYERS.forEach(p=>{const o=S.owned[p.id]; if(o&&o.n>1){n+=o.n-1;g+=(o.n-1)*RAR[p.rar].sell;o.n=1}});
    if(!n)return; if(!confirm(`Vendre ${n} doublon${n>1?"s":""} pour ${g} jetons ? Les brillantes sont conservées.`))return;
    addCoins(g);save();toast(`+${fmt(g)} jetons`);render();return;
  }
  if(t.dataset.mbuy!==undefined){
    const it=S.market.items[+t.dataset.mbuy]; if(!it||it.sold||S.coins<it.price)return;
    S.coins-=it.price; it.sold=true; const wasNew=!isOwned(it.id); addCard(it.id,false); save();
    toast(wasNew?`${P[it.id].nom} rejoint ton album`:`${P[it.id].nom} ajouté (doublon)`); render(); return;
  }
  if(t.id==="autoXI"){S.lineup=bestLineup();save();render();return}
  if(t.dataset.slot!==undefined){openPicker(+t.dataset.slot);return}
  if(t.dataset.opp){S.opp=t.dataset.opp;save();render();return}
  if(t.id==="playMatch"){playMatch();return}
  if(t.id==="exp"){
    const blob=new Blob([JSON.stringify({v:1,date:new Date().toISOString(),save:S},null,1)],{type:"application/json"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`swaps-${today()}.json`;document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);return;
  }
  if(t.id==="reset"){if(confirm("Effacer toute ta collection et recommencer ?")){S=freshState();save();render();toast("Nouvelle partie")}return}
  if(t.id==="clearPh"){PHOTOS={};try{localStorage.removeItem(PHOTO_KEY)}catch(e){}Object.keys(BLOBURL).forEach(k=>{URL.revokeObjectURL(BLOBURL[k]);delete BLOBURL[k]});idbClear().catch(()=>{});toast("Cache des photos vidé");render();return}
  if(t.id==="dlAll"){preloadAll();return}
});
document.addEventListener("change",e=>{
  if(e.target.id==="clubSel"){$("#clubMini").innerHTML=packHTML("club",e.target.value)}
  if(e.target.id==="fRar"){S.albumRar=e.target.value;save();render()}
  if(e.target.id==="fPos"){S.albumPos=e.target.value;save();render()}
  if(e.target.id==="imp"){
    const f=e.target.files[0]; if(!f) return;
    f.text().then(txt=>{const j=JSON.parse(txt); if(!j.save||!j.save.owned) throw 0;
      S=Object.assign(freshState(),j.save); save(); render(); toast("Sauvegarde importée")}).catch(()=>toast("Fichier de sauvegarde illisible"));
  }
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("#ov").hidden){closeOv();render()}});

document.addEventListener("pointermove",e=>{
  const b=e.target.closest&&e.target.closest(".pack-big:not(.mini):not(:disabled):not(.torn)"); if(!b||matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const r=b.getBoundingClientRect(), x=(e.clientX-r.left)/r.width, y=(e.clientY-r.top)/r.height, pk=b.querySelector(".pk");
  pk.style.setProperty("--ry",((x-.5)*22).toFixed(1)+"deg"); pk.style.setProperty("--rx",((.5-y)*16).toFixed(1)+"deg");
  b.querySelectorAll(".pk-sheen").forEach(s=>s.style.setProperty("--sx",(100-x*100).toFixed(0)+"%"));
});
document.addEventListener("pointerout",e=>{
  const b=e.target.closest&&e.target.closest(".pack-big"); if(!b||b.contains(e.relatedTarget)) return;
  const pk=b.querySelector(".pk"); if(pk){pk.style.setProperty("--ry","0deg");pk.style.setProperty("--rx","0deg")}
});
setInterval(()=>{
  const before=S.packs; refill();
  if(S.packs!==before){renderHeader(); if(S.view==="home"&&$("#ov").hidden) render(); return}
  const el=$("#timer"); if(el) el.textContent = S.packs>=MAX_STOCK?"Réserve pleine":mmss(msToNext());
},1000);

render();
if(MIGRATION.moved||MIGRATION.gone){ save();
  toast(`Effectifs mis à jour : ${MIGRATION.moved} carte${MIGRATION.moved>1?"s suivent":" suit"} leur joueur dans son nouveau club`+(MIGRATION.gone?`, ${MIGRATION.gone} joueur${MIGRATION.gone>1?"s":""} parti${MIGRATION.gone>1?"s":""} de L1 → +${MIGRATION.refund} jetons`:"")); }
if(SESSION) pullOnStart();
else { let w=null; try{w=localStorage.getItem(WELCOME_KEY)}catch(e){} if(!w){ try{localStorage.setItem(WELCOME_KEY,"1")}catch(e){} showWelcome(); } }
</script>
